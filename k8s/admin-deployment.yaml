apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtok-admin
  namespace: gymtok
  labels:
    app: gymtok-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gymtok-admin
  template:
    metadata:
      labels:
        app: gymtok-admin
    spec:
      containers:
        - name: admin
          image: gymtok/admin:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.gymtok.app"
          envFrom:
            - secretRef:
                name: gymtok-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gymtok-admin
  namespace: gymtok
spec:
  selector:
    app: gymtok-admin
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
