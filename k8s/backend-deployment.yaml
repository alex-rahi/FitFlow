apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtok-api
  namespace: gymtok
  labels:
    app: gymtok-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gymtok-api
  template:
    metadata:
      labels:
        app: gymtok-api
    spec:
      containers:
        - name: api
          image: gymtok/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gymtok-config
            - secretRef:
                name: gymtok-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gymtok-api
  namespace: gymtok
spec:
  selector:
    app: gymtok-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gymtok-api-hpa
  namespace: gymtok
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gymtok-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
