apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtok-worker
  namespace: gymtok
  labels:
    app: gymtok-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gymtok-worker
  template:
    metadata:
      labels:
        app: gymtok-worker
    spec:
      containers:
        - name: worker
          image: gymtok/worker:latest
          envFrom:
            - configMapRef:
                name: gymtok-config
            - secretRef:
                name: gymtok-secrets
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gymtok-worker-hpa
  namespace: gymtok
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gymtok-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
