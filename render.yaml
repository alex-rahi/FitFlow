# Free-tier backend on Render — https://render.com/docs/free
# Connect repo, set secrets in Render dashboard (DATABASE_URL, SUPABASE_JWT_SECRET, etc.)

services:
  - type: web
    name: gymtok-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USE_PLACEHOLDERS
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
